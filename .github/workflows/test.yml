name: Node.js CI

on: [push, pull_request]

# This workflow runs the code of the pull requests. Its build of a pull request
# is also what the Preview workflow (preview.yml) publishes, with the
# Cloudflare token: that token lives in the "cloudflare" environment, which
# this workflow does not use, and the token GitHub gives this workflow can
# only read.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .node-version
      # Corepack reads the Yarn version from package.json (packageManager)
      - run: corepack enable
      - run: yarn install --immutable
      # The /dev/ page snapshot is refreshed by build.sh: the automatic token
      # gives it 5000 requests/hour instead of the 60 shared by every anonymous
      # build running on this runner.
      - run: ./build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The build Cloudflare serves (see build.sh), so that the preview of
          # a pull request is built exactly like production.
          CLOUDFLARE_DEPLOY: 1
      # Published by the Preview workflow. Pull requests from forks get no
      # preview. include-hidden-files keeps the .well-known folder.
      - name: Keep the build for the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: build
          include-hidden-files: true
          retention-days: 1
